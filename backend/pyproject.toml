[project]
name = "rag-learning-studio"
version = "0.2.0"
description = "A local, privacy-friendly RAG pipeline for asking questions over your own PDFs - and a playground for seeing how every stage transforms your data. Served over HTTP for the React frontend in ../frontend; the Streamlit UI has been retired."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.9",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pymupdf4llm>=1.28.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Only needed if config.py's LLM_PROVIDER = "anthropic" instead of "ollama".
anthropic = [
    "langchain-anthropic>=0.3.0",
]
